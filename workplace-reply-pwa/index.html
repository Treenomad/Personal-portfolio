<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ec" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="职场回复器" />
    <title>高情商职场回复器</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css?v=20260606" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img src="./assets/icon.svg" alt="" class="brand-mark" />
          <div>
            <h1>高情商职场回复器</h1>
            <p id="todayLabel"></p>
          </div>
        </div>
        <button class="icon-button" id="themeButton" type="button" aria-label="切换深浅色" title="切换深浅色">
          <span aria-hidden="true">◐</span>
        </button>
      </header>

      <main class="workspace">
        <section class="composer" aria-labelledby="composerTitle">
          <div class="section-head">
            <h2 id="composerTitle">生成回复</h2>
            <button class="ghost-button" id="clearButton" type="button">清空</button>
          </div>

          <div class="field">
            <label for="scenario">场景</label>
            <select id="scenario">
              <option value="reject">拒绝请求</option>
              <option value="urge">催进度</option>
              <option value="feedback">反馈问题</option>
              <option value="boss">回复上级</option>
              <option value="salary">谈薪加薪</option>
              <option value="leave">请假调休</option>
              <option value="apology">道歉修复</option>
              <option value="boundary">表达边界</option>
            </select>
          </div>

          <div class="field">
            <label for="relationship">对象</label>
            <select id="relationship">
              <option value="同事">同事</option>
              <option value="上级">上级</option>
              <option value="下属">下属</option>
              <option value="客户">客户</option>
              <option value="合作方">合作方</option>
              <option value="HR">HR</option>
            </select>
          </div>

          <div class="field-grid">
            <div class="field">
              <label for="channel">渠道</label>
              <select id="channel">
                <option value="feishu">飞书/IM</option>
                <option value="email">邮件</option>
                <option value="wechat">微信</option>
                <option value="meeting">会议口头</option>
              </select>
            </div>

            <div class="field">
              <label for="length">长度</label>
              <select id="length">
                <option value="standard">适中</option>
                <option value="short">简短</option>
                <option value="detailed">详细</option>
              </select>
            </div>
          </div>

          <div class="field">
            <span class="label">语气</span>
            <div class="segmented" role="radiogroup" aria-label="语气">
              <label><input type="radio" name="tone" value="温和" checked /> <span>温和</span></label>
              <label><input type="radio" name="tone" value="坚定" /> <span>坚定</span></label>
              <label><input type="radio" name="tone" value="专业" /> <span>专业</span></label>
              <label><input type="radio" name="tone" value="直接" /> <span>直接</span></label>
            </div>
          </div>

          <div class="field">
            <label for="stakes">敏感度 <strong id="stakesValue">3</strong></label>
            <input id="stakes" type="range" min="1" max="5" value="3" />
          </div>

          <div class="field">
            <label for="context">背景</label>
            <textarea id="context" rows="4" placeholder="例如：同事临时让我接一个不属于我的任务，但我今天已经排满。"></textarea>
          </div>

          <div class="field">
            <label for="rawMessage">原本想说</label>
            <textarea id="rawMessage" rows="4" placeholder="例如：我真的没空，你能不能别每次都临时找我。"></textarea>
          </div>

          <div class="switches" aria-label="偏好">
            <label><input id="keepBoundary" type="checkbox" checked /> <span>保留边界</span></label>
            <label><input id="giveReason" type="checkbox" checked /> <span>给出理由</span></label>
            <label><input id="offerNext" type="checkbox" checked /> <span>给下一步</span></label>
          </div>

          <button class="primary-button" id="generateButton" type="button">
            <span aria-hidden="true">↗</span>
            生成 3 个版本
          </button>

          <div class="engine-status" id="engineStatus" aria-live="polite">
            <strong id="engineBadge">本地模板</strong>
            <p id="engineMessage">当前使用离线模板生成，适合快速出稿。</p>
          </div>
        </section>

        <section class="results" aria-live="polite">
          <div class="section-head">
            <h2>回复结果</h2>
            <button class="ghost-button" id="copyAllButton" type="button">复制全部</button>
          </div>

          <div class="analysis-strip" id="analysisStrip">
            <div>
              <span>关系风险</span>
              <strong id="riskLabel">中</strong>
            </div>
            <div>
              <span>表达目标</span>
              <strong id="goalLabel">守住边界</strong>
            </div>
            <div>
              <span>建议策略</span>
              <strong id="strategyLabel">先承接再转向</strong>
            </div>
          </div>

          <div class="coach-panel" id="coachPanel">
            <strong id="coachHeadline">发送建议</strong>
            <p id="coachSummary">系统会根据渠道、敏感度和措辞给出发送前建议。</p>
          </div>

          <div class="reply-list" id="replyList"></div>

          <div class="prompt-drawer">
            <button class="drawer-toggle" id="promptToggle" type="button">
              <span>模型提示词</span>
              <span aria-hidden="true">⌄</span>
            </button>
            <pre id="promptBox" hidden></pre>
          </div>
        </section>

        <aside class="history-panel" aria-labelledby="historyTitle">
          <div class="section-head">
            <h2 id="historyTitle">收藏</h2>
            <button class="ghost-button" id="clearHistoryButton" type="button">清除</button>
          </div>
          <div id="historyList" class="history-list"></div>

          <section class="insight-panel" aria-labelledby="insightTitle">
            <div class="section-head">
              <h2 id="insightTitle">效率看板</h2>
              <span class="panel-tag">本机</span>
            </div>
            <div id="insightGrid" class="insight-grid"></div>
            <p id="insightNote" class="insight-note"></p>
            <div id="outcomeList" class="outcome-list"></div>
          </section>
        </aside>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js?v=20260606" type="module"></script>
  </body>
</html>
